<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Central NexoOps para consulta da disponibilidade e do estado atual dos serviços internos.">
    <title>NexoOps — Disponibilidade dos Serviços</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="assets/nexoops-icon.svg" type="image/x-icon">
    <script src="script.js" defer></script>
    <script src="./assets/services-data.js"></script>
</head>
<body>

    <main>
        <header>
            <h1>NexoOps — Disponibilidade dos Serviços</h1>
            <p>Central de consulta da disponibilidade e do estado atual dos serviços internos.</p>
        </header>
        
        <h2>Filtros</h2>
        <section>
        
            <fieldset>
                <legend>Estado do serviço</legend>

                <button  type="button" class="filter activeFilter" data-status="allType">Todos</button>
                <button  type="button" class="filter" data-status="operational">Operacionais</button>
                <button  type="button" class="filter" data-status="degraded">Degradados</button>
                <button  type="button" class="filter" data-status="outage">Indisponíveis</button>

            </fieldset>

      
            <section id="test">
                <section>
                    <h2>Detalhes do serviço</h2>
                    <p id="servicesCount"></p>
                    <ul id="allServices">
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                </section>
            
                <article id="serviceDetailsContainer">                    
                    <p>Selecione um serviço para visualizar os detalhes.</p>
                </article>
            </section>
        </section>

        <section id="servicesContainer">

        </section>
    </main>

</body>
</html>
